version: '3.8'

services:
  paylist-app:
    image: rutthawitc/paylist-pwa-dashboard:latest
    container_name: paylist-dashboard
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Persist SQLite database files
      - ./data:/app/data
      # Persist Prisma migrations
      - ./prisma-data:/app/prisma
    networks:
      - paylist-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  paylist-network:
    driver: bridge
